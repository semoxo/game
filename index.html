<!DOCTYPE html>
<html lang="ar" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b10;--p:#12141d;--p2:#1a1d29;--ln:#262a3a;--tx:#e8eaf2;--mu:#8b90a6;--ac:#b6ff3c;--vi:#7c5cff;--done:#34d399;--play:#fbbf24;--back:#94a3b8}
*{box-sizing:border-box;margin:0}body{font-family:'Readex Pro',sans-serif;background:var(--bg);background-image:radial-gradient(900px 400px at 80% -10%,#7c5cff22,transparent),radial-gradient(700px 300px at 10% 0,#b6ff3c12,transparent);color:var(--tx);min-height:100vh}
.mono,.chip i,.al button,.badge{font-family:'JetBrains Mono',monospace}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#0a0b10ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding:12px 16px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:1400px;margin:auto}h1{font-size:20px;font-weight:700}h1 b{color:var(--ac)}
input,select{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit;font-size:14px;outline:0}input:focus,select:focus{border-color:var(--ac)}
#q{flex:1;min-width:200px}.btn{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:13px}.btn.on{border-color:var(--ac);color:var(--ac)}
.rail{display:flex;gap:8px;overflow-x:auto;max-width:1400px;margin:10px auto 0;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--ln);background:var(--p);border-radius:99px;padding:5px 12px;font-size:13px}.chip i{font-style:normal;font-size:11px;color:var(--mu);margin-inline-start:6px}.chip.on{background:var(--ac);color:#0a0b10;border-color:var(--ac)}.chip.on i{color:#0a0b10}
.al{display:flex;gap:2px;overflow-x:auto;max-width:1400px;margin:8px auto 0;direction:ltr}.al button{flex:none;width:28px;height:28px;border-radius:7px;font-size:12px;color:var(--mu)}.al button.on{background:var(--vi);color:#fff}.al button:hover{color:var(--ac)}
main{max-width:1400px;margin:auto;padding:16px}#info{color:var(--mu);font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{position:relative;border-radius:12px;background:var(--p);border:1px solid var(--ln);overflow:hidden;cursor:pointer;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 14px 36px -10px #b6ff3c66,0 0 0 1px #b6ff3c44;backdrop-filter:blur(8px)}
.pw{position:relative;aspect-ratio:2/3;background:#000;overflow:hidden}.pw img,.fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center;background:linear-gradient(160deg,hsl(var(--h) 55% 28%),hsl(calc(var(--h) + 50) 60% 12%))}.fb b{font:700 36px 'JetBrains Mono'}.fb span{font-size:11px;opacity:.75;direction:ltr}
.meta{padding:8px 10px}.meta h3{font-size:12.5px;font-weight:600;direction:ltr;text-align:left;line-height:1.3;height:2.6em;overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:4px}
.badge{font-size:11px;color:var(--ac)}.ser{font:11px 'JetBrains Mono';color:var(--vi);background:#7c5cff1f;border-radius:6px;padding:2px 6px;cursor:pointer;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ser:hover{background:var(--vi);color:#fff}
.fav,.dot{position:absolute;top:8px;width:30px;height:30px;border-radius:50%;background:#000a;backdrop-filter:blur(6px);display:grid;place-items:center;font-size:14px}.fav{inset-inline-start:8px}.dot{inset-inline-end:8px}.fav.on{color:#ff4d6d}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--back);opacity:.5}.sdot.done{background:var(--done);opacity:1}.sdot.play{background:var(--play);opacity:1}.sdot.back{opacity:1}
#grid.list{display:block}.lr{display:grid;grid-template-columns:36px 44px 1.6fr 1fr 1fr 60px auto;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);cursor:pointer;border-radius:8px;transition:.2s}.lr:hover{background:var(--p2);box-shadow:inset 0 0 0 1px #b6ff3c55}
.lr .th{width:44px;height:66px;border-radius:6px;overflow:hidden;position:relative}.lr .nm{font-weight:600;direction:ltr;text-align:left;font-size:14px}.lr .gn{font-size:12px;color:var(--mu)}.sb{display:flex;gap:4px}.sb button{border:1px solid var(--ln);border-radius:8px;padding:3px 8px;font-size:12px}.sb button.on{border-color:currentColor;background:#ffffff10}
@media(max-width:760px){.lr{grid-template-columns:28px 44px 1fr auto}.lr .gn,.lr .sr,.lr .hr{display:none}#grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}}
.ov{position:fixed;inset:0;background:#000c;backdrop-filter:blur(10px);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.ov.open{display:flex}
.md{background:var(--p);border:1px solid var(--ln);border-radius:18px;width:min(860px,100%);max-height:92vh;overflow:auto;display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px;position:relative}
.md .pw{border-radius:12px;cursor:zoom-in}.x{position:absolute;top:10px;inset-inline-end:12px;font-size:22px;color:var(--mu)}
.md h2{font-size:22px;direction:ltr;text-align:left;margin-bottom:8px}.tabs{display:flex;gap:6px;margin:14px 0 10px}.tabs button{padding:6px 14px;border-radius:8px;border:1px solid var(--ln);font-size:13px}.tabs button.on{background:var(--ac);color:#0a0b10;border-color:var(--ac)}
.story{unicode-bidi:plaintext;line-height:1.9;color:#cfd3e4;font-size:14.5px}.sp{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}.sp dt{color:var(--mu)}.sp dd{font-family:'JetBrains Mono';font-size:13px;direction:ltr;text-align:left}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}.acts input{width:130px;font:12px 'JetBrains Mono'}.tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tg span{font-size:12px;border:1px solid var(--ln);border-radius:99px;padding:2px 10px;color:var(--mu)}
@media(max-width:700px){.md{grid-template-columns:1fr}.md .pw{max-width:200px;margin:auto}}
#lb img{max-width:96vw;max-height:94vh;border-radius:10px;box-shadow:0 0 80px #7c5cff55}#lb{cursor:zoom-out;z-index:60}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);background:var(--p2);border:1px solid var(--ac);color:var(--tx);padding:10px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:90;pointer-events:none;font-size:14px}#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mu);padding:70px 0}
textarea{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit;font-size:14px;outline:0;resize:vertical}
.adm{display:none;max-width:1400px;margin:8px auto 0;gap:8px;flex-wrap:wrap}.adm.open{display:flex}.adm .btn{border-color:var(--vi)}
a.btn{text-decoration:none;color:var(--tx);display:inline-block}.yt{border-color:#ff4d4d!important;color:#ff8a8a!important}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}.fl input,.fl textarea{width:100%}
.ck{font-size:12px;display:inline-flex;gap:4px;align-items:center;margin:4px 0 4px 10px}
.srow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.srow .ser{max-width:none;font-size:13px}.srow .mono{font-size:12px;color:var(--mu);flex:1}.srow input{width:170px;padding:5px 8px}
</style></head><body>
<header><div class="top"><h1>مكتبة <b>الألعاب</b></h1><input id="q" type="search" placeholder="ابحث بالاسم أو السلسلة أو النوع أو القصة…">
<select id="stf"><option value="">كل الحالات</option><option value="done">🟢 مكتملة</option><option value="play">🟡 ألعبها</option><option value="back">⚪ قائمة الانتظار</option></select>
<button class="btn" id="favb">❤️ المفضلة <span class="mono" id="fc">0</span></button><button class="btn" id="serb">🗂️ السلاسل</button><button class="btn" id="admb" title="لوحة الإدارة">⚙️ إدارة</button><button class="btn" id="vg" title="شبكة">▦</button><button class="btn" id="vl" title="قائمة">☰</button></div>
<div class="rail" id="rail"></div><div class="al" id="al"></div><div class="adm" id="adm"><button class="btn" data-act="add">＋ إضافة لعبة</button><button class="btn" data-act="cats">🏷 التصنيفات</button><button class="btn" data-act="exp">⬇ تصدير</button><button class="btn" data-act="imp">⬆ استيراد</button><button class="btn" data-act="rst">↺ إعادة ضبط</button><button class="btn" data-act="pwchg">🔑 تغيير كلمة السر</button><button class="btn" data-act="logout">🚪 خروج</button><input type="file" id="impf" accept=".json" hidden></div></header>
<main><div id="info"></div><div id="grid"></div></main>
<div class="ov" id="mo"><div class="md" id="mb"></div></div><div class="ov" id="lb"></div><div class="ov" id="so"><div class="md" id="sbox" style="display:block"></div></div><div id="toast"></div>

$('sbox').innerHTML=`<button class="x" data-act="close">×</button><h2 style="unicode-bidi:plaintext">#${esc(s)} <span class="mono" style="font-size:13px;color:var(--mu)">${a.length} لعبة · مرتبة زمنياً</span></h2><div class="acts" style="margin:8px 0">${BK!=null?'<button class="btn on" data-act="back">← رجوع للعبة</button>':''}<button class="btn" data-act="sall">🗂️ كل السلاسل</button><a class="ser" data-ser="${esc(s)}" style="padding:7px 12px;font-size:13px">عرض في المكتبة</a></div>${a.map(({g,i},k)=>`<div class="srow" data-open="${i}" style="cursor:pointer"><span class="mono" style="color:var(--mu);flex:none;width:24px">${k+1}</span><div class="pw" style="width:44px;height:66px;aspect-ratio:auto;border-radius:6px;flex:none">${poster(g)}</div><div style="flex:1;direction:ltr;text-align:left;font-weight:600;font-size:14px">${esc(g.n)}<div style="font-size:12px;color:var(--mu);font-weight:400">${g.y} · ${hrs(g)}</div></div><span class="sdot ${S.stat[g.k]||''}"></span></div>`).join('')}`;$('so').classList.add('open');wkScan()}
function ask(m,f){_cb=f;$('mb').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:10px"><p style="font-size:17px;margin-bottom:18px">${esc(m)}</p><div class="acts" style="justify-content:center"><button class="btn on" data-act="yes">نعم، تأكيد</button><button class="btn" data-act="no">إلغاء</button></div></div>`;$('mo').classList.add('open')}
function buildG(){G=B.filter(g=>!S.del[g.k]).map(g=>S.edits[g.k]?{...g,...S.edits[g.k]}:g).concat(S.added).map(g=>({...g,tg:fixTg(g.tg)}))}
function form(i){_img=null;_noimg=i>=0&&!!G[i].noimg;const g=i>=0?G[i]:{n:'',s:'',g:'',tg:[],y:new Date().getFullYear(),h:0,st:'',dev:'',gpu:'',cpu:'',ram:'',disk:'',img:''},f=(id,l,v,x='')=>`<label class="fl">${l}<input id="f_${id}" ${x} value="${esc(v==null?'':v)}"></label>`,ss=[...new Set(G.map(x=>x.s).filter(Boolean))].sort();
$('mb').innerHTML=`<button class="x" data-act="close">×</button><div style="grid-column:1/-1"><h2 style="unicode-bidi:plaintext">${i>=0?'تعديل لعبة':'إضافة لعبة'}</h2><div style="display:flex;gap:14px;align-items:center;margin:6px 0 14px;flex-wrap:wrap"><div class="pw" id="f_prev" style="width:90px;flex:none;border-radius:8px">${i>=0?poster(g):''}</div><div style="flex:1;min-width:220px"><div style="font-size:13px;margin-bottom:8px">صورة الغلاف</div><label class="btn" style="display:inline-block;cursor:pointer">📁 رفع صورة من جهازك<input type="file" id="f_file" accept="image/*" hidden></label> <button class="btn" data-act="imgclr" style="margin-inline-start:6px">↺ رجوع للتلقائي</button> <button class="btn" data-act="imgdel" style="color:#ff6b81;margin-top:6px">🗑 إزالة الصورة</button><p style="font-size:11px;color:var(--mu);margin-top:8px">أو الصق رابط صورة في خانة «رابط صورة الغلاف» بالأسفل.</p></div></div><div class="fg">${f('n','اسم اللعبة',g.n)}${f('s','السلسلة (Game Series)',g.s,'list="sl"')}<datalist id="sl">${ss.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>${f('g','النوع (بالعربي)',g.g)}${f('y','سنة الإصدار',g.y,'type="number"')}${f('h','ساعات القصة (HLTB)',g.h,'type="number"')}${f('dev','المطوّر',g.dev)}${f('gpu','كرت الشاشة (أدنى)',g.gpu)}${f('cpu','المعالج',g.cpu)}${f('ram','الذاكرة RAM',g.ram)}${f('disk','المساحة',g.disk)}${f('img','رابط صورة الغلاف (اختياري)',g.img&&!g.img.startsWith('data:')?g.img:'','dir="ltr"')}</div>
<div style="margin:10px 0"><span style="font-size:12px;color:var(--mu)">التصنيفات:</span><br>${cats().map(t=>`<label class="ck"><input type="checkbox" value="${t}" ${g.tg.includes(t)?'checked':''}>${t}</label>`).join('')}</div>
<label class="fl">القصة<textarea id="f_st" rows="4">${esc(g.st||'')}</textarea></label><div class="acts" style="margin-top:14px"><button class="btn on" data-act="fsave" data-i="${i}">💾 حفظ</button><button class="btn" data-act="close">إلغاء</button></div></div>`;$('mo').classList.add('open')}
function seriesPanel(){const m={};G.forEach(g=>{if(g.s)(m[g.s]=m[g.s]||[]).push(g)});const ks=Object.keys(m).sort((a,b)=>a.localeCompare(b));
$('sbox').innerHTML=`<button class="x" data-act="close">×</button><h2 style="unicode-bidi:plaintext">🗂️ السلاسل (${ks.length})</h2>${BK!=null?'<button class="btn on" data-act="back" style="margin-bottom:8px">← رجوع للعبة</button>':''}<p style="font-size:12px;color:var(--mu);margin-bottom:8px">اضغط على اسم السلسلة لعرض ألعابها بالترتيب الزمني${ADM?' — ويمكنك إعادة تسميتها من هنا':''}</p>${ks.map((k,j)=>{const a=m[k],d=a.filter(g=>S.stat[g.k]=='done').length;return`<div class="srow"><span class="ser" data-ser="${esc(k)}">#${esc(k)}</span><span class="mono">${a.length} لعبة · ${d} مكتملة</span>${ADM?`<input id="rn_${j}" value="${esc(k)}"><button class="btn" data-act="ren" data-s="${esc(k)}" data-j="${j}">إعادة تسمية</button>`:''}</div>`}).join('')}`;$('so').classList.add('open')}
function admUI(){$('adm').classList.toggle('open',ADM);$('admb').classList.toggle('on',ADM);$('admb').textContent=ADM?'🔓 خروج من الإدارة':'⚙️ إدارة'}
$('serb').onclick=()=>{BK=null;seriesPanel()};$('admb').onclick=()=>{if(ADM){logout();return}let p=null;try{p=localStorage.getItem('gl_pw')}catch(e){}pwModal(p?'login':'setup')};
$('impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.edits!='object'||!Array.isArray(d.added)||typeof d.del!='object')throw 0;S.edits=d.edits;S.added=d.added;S.del=d.del;S.cats=Array.isArray(d.cats)?d.cats:undefined;S.ren=d.ren||{};S.allLabel=d.allLabel||'الكل';save();buildG();render();toast('تم الاستيراد')}catch(x){toast('ملف غير صالح')}e.target.value=''};r.readAsText(f)};
buildG();admUI();alpha();render();
</script></body></html>
